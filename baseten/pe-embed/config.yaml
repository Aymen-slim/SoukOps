model_name: wassalha-pe-embed
python_version: py311
python_requirements:
  - torch
  - open_clip_torch
  - timm
  - pillow
resources:
  accelerator: L4
  cpu: "2"
  memory: 8Gi
runtime:
  predict_concurrency_per_worker: 4
# Autoscaling is set in the Baseten console after deploy: min 0 (scale to
# zero) while developing; min 1 only for rehearsals and demo day.
